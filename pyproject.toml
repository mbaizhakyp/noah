[project]
name = "noah"
version = "0.1.0"
description = "Street-level flood nowcast: which roads flood in the next 18 h, routing around them, answers by text."
requires-python = ">=3.12,<3.13"
dependencies = [
    "geopandas>=1.2.0",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "osmnx>=2.1.1",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
    "shapely>=2.2.0",
    "xarray>=2026.9.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
