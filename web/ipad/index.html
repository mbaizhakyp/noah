<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noah</title>
<meta name="description" content="Which streets are forecast to flood, and when to leave.">
<meta name="theme-color" content="#faf7f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Noah">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  /* Spec 021, docs/09-IPAD_APP.md: warm paper. Orange is for controls only; roads and stops use ink, red and amber. */
  :root {
    --paper: #faf7f2; --card: #fffdf9; --sand: #efe8dc; --line: #e7dfd2;
    --ink: #1c1a17; --ink-2: #4f4a42; --ink-3: #6b6356;
    --accent: #c2410c; --accent-soft: #fbe9dc;
    --flood: #d92d20; --flood-ink: #a8231a; --flood-soft: #fbe4e1;
    --amber: #f2a100; --amber-ink: #8a5100; --amber-soft: #fbefd5;
    --water: #bfd3d6;
    --shadow: 0 1px 2px rgba(28,26,23,.06), 0 14px 36px -12px rgba(28,26,23,.28);
    --ease: cubic-bezier(.2,.9,.25,1);
    --top: 76px; --banner: 150px;
    --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--paper); color: var(--ink);
    font: 18px/1.4 "Overpass", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }

  /* ---------- top bar ---------- */
  .top { position: fixed; left: 0; right: 0; top: 0; height: calc(var(--top) + var(--st)); padding: var(--st) calc(24px + var(--sr)) 0 calc(24px + var(--sl));
    display: flex; align-items: center; gap: 22px; background: var(--paper); border-bottom: 1px solid var(--line); z-index: 5; }
  .brand { font-size: 27px; font-weight: 900; letter-spacing: -.02em; color: var(--accent); }
  .seg { display: inline-flex; background: var(--sand); border-radius: 14px; padding: 4px; gap: 2px; }
  .seg button { min-height: 48px; padding: 0 22px; border-radius: 11px; font-weight: 700; color: var(--ink-2); transition: background .2s var(--ease), color .2s var(--ease); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .livebtn { margin-left: auto; display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 18px; border-radius: 999px;
    background: var(--card); border: 1.5px solid var(--line); font-weight: 800; font-size: 16px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--flood); flex: none; }

  /* ---------- banner: the answer, as one sentence ---------- */
  .banner { position: fixed; left: 0; right: 0; top: calc(var(--top) + var(--st)); min-height: var(--banner); z-index: 4;
    background: var(--ink); color: var(--paper); display: flex; align-items: center; gap: 28px; padding: 18px calc(32px + var(--sr)) 18px calc(32px + var(--sl)); }
  .say { flex: 1; min-width: 0; display: flex; align-items: center; gap: 26px; transition: opacity .2s var(--ease); }
  .say.in { animation: sayin .3s var(--ease); }
  @keyframes sayin { from { opacity: .3; transform: translateY(4px); } }
  #big { font-size: 58px; font-weight: 900; letter-spacing: -.025em; line-height: 1; white-space: nowrap; }
  #rest { font-size: 20px; font-weight: 600; line-height: 1.3; opacity: .9; max-width: 360px; }
  .when { flex: none; display: inline-flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 22px; border-radius: 14px;
    background: var(--accent); color: #fff; font-weight: 800; font-size: 18px; }
  .when svg { width: 16px; height: 16px; }

  /* ---------- body: map + list ---------- */
  .body { position: fixed; left: 0; right: 0; bottom: 0; top: calc(var(--top) + var(--st) + var(--banner)); display: grid; grid-template-columns: 1fr minmax(420px, 40%); }
  #map { position: relative; background: var(--sand); }
  .issued { position: absolute; left: calc(16px + var(--sl)); bottom: calc(16px + var(--sb)); z-index: 2; background: var(--card); border-radius: 12px;
    padding: 9px 14px; font-size: 14px; font-weight: 700; color: var(--ink-2); box-shadow: var(--shadow); }
  .list { border-left: 1px solid var(--line); background: var(--paper); display: flex; flex-direction: column; min-height: 0; }
  .lh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px calc(28px + var(--sr)) 8px 28px; }
  .k { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .best { min-height: 44px; padding: 0 14px; border-radius: 12px; background: var(--accent-soft); color: #a3360a; font-weight: 800; font-size: 15px; }
  .rows { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 calc(28px + var(--sr)) calc(24px + var(--sb)) 28px; }
  .row { width: 100%; text-align: left; display: block; border-top: 1px solid var(--line); padding: 0; position: relative; }
  .row .main { display: flex; align-items: center; gap: 14px; min-height: 80px; }
  .row.changed::before { content: ""; position: absolute; left: -14px; top: 12px; bottom: 12px; width: 4px; border-radius: 2px; background: var(--accent); }
  .disc { flex: none; display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--ink); color: var(--paper); font-weight: 900; font-size: 16px; }
  .disc.hold { background: var(--flood); }
  .row .name { flex: 1; min-width: 0; font-size: 19px; font-weight: 800; line-height: 1.2; }
  .row .name small { display: block; font-size: 14px; font-weight: 600; color: var(--ink-3); margin-top: 2px; }
  .st { flex: none; font-weight: 900; font-size: 18px; text-align: right; }
  .st.go { color: var(--amber-ink); } .st.hold { color: var(--flood-ink); } .st.no { color: var(--ink-2); font-weight: 800; }
  .more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s var(--ease); }
  .row.open .more { grid-template-rows: 1fr; }
  .more > div { overflow: hidden; }
  .more p { font-size: 16px; font-weight: 600; color: var(--ink-2); padding: 0 0 6px 50px; }
  .more p:last-child { padding-bottom: 18px; color: var(--ink-3); font-size: 14px; }
  .check .main { min-height: 72px; }
  .check .ico { flex: none; width: 36px; height: 36px; border-radius: 10px; background: var(--sand); display: grid; place-items: center; color: var(--ink-2); }
  .check .ico.warn { background: var(--amber-soft); color: var(--amber-ink); }
  .check .ico svg { width: 18px; height: 18px; }
  .empty { padding: 28px 0; color: var(--ink-3); font-weight: 600; }
  .skel { height: 80px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 14px; }
  .skel i { display: block; height: 14px; border-radius: 7px; background: var(--sand); }

  /* ---------- departure popover ---------- */
  .scrim { position: fixed; inset: 0; z-index: 8; background: rgba(28,26,23,.0); transition: background .25s var(--ease); }
  .scrim.dim { background: rgba(28,26,23,.32); }
  .pop { position: fixed; z-index: 9; right: calc(24px + var(--sr)); top: calc(var(--top) + var(--st) + var(--banner) - 18px); width: 520px; background: var(--card); color: var(--ink);
    border-radius: 20px; box-shadow: var(--shadow); padding: 22px 24px 20px; transform-origin: top right; animation: popin .22s var(--ease); }
  @keyframes popin { from { opacity: 0; transform: scale(.96) translateY(-6px); } }
  .pop h3 { font-size: 15px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .pop .val { font-size: 40px; font-weight: 900; letter-spacing: -.02em; margin: 4px 0 14px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--accent) 0 var(--p, 0%), var(--sand) var(--p, 0%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 36px; height: 36px; margin-top: -14px; border-radius: 50%; background: #fff; border: 4px solid var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  input[type=range]::-moz-range-track { height: 8px; border-radius: 4px; background: var(--sand); }
  input[type=range]::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 4px solid var(--accent); }
  .ticks { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--ink-3); margin-top: 2px; }
  .pop .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
  .pop .foot span { font-size: 14px; color: var(--ink-3); font-weight: 600; }
  .tb { min-height: 44px; padding: 0 16px; border-radius: 12px; background: var(--sand); font-weight: 800; font-size: 15px; }

  /* ---------- live sheet ---------- */
  .sheet { position: fixed; z-index: 9; top: 0; right: 0; bottom: 0; width: min(480px, 92vw); background: var(--paper); box-shadow: var(--shadow);
    display: flex; flex-direction: column; padding-top: var(--st); transform: translateX(100%); transition: transform .32s var(--ease); }
  .sheet.open { transform: none; }
  .sh { display: flex; align-items: center; justify-content: space-between; padding: 22px calc(24px + var(--sr)) 14px 24px; }
  .sh h2 { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 900; }
  .x { width: 48px; height: 48px; border-radius: 50%; background: var(--sand); display: grid; place-items: center; }
  .x svg { width: 20px; height: 20px; }
  .tabs { display: flex; gap: 2px; margin: 0 calc(24px + var(--sr)) 6px 24px; background: var(--sand); border-radius: 14px; padding: 4px; }
  .tabs button { flex: 1; min-height: 46px; border-radius: 11px; font-weight: 800; font-size: 16px; color: var(--ink-2); }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .pane { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px calc(24px + var(--sr)) calc(28px + var(--sb)) 24px; }
  .cam { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; margin-bottom: 16px; }
  .frame { position: relative; aspect-ratio: 16 / 9; background: #2b2925; display: grid; place-items: center; color: #cfc6b8; font-weight: 700; font-size: 15px; }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .frame .tag { position: absolute; left: 12px; top: 12px; display: inline-flex; align-items: center; gap: 8px; background: rgba(28,26,23,.78); color: #fff;
    font-size: 13px; font-weight: 800; padding: 6px 10px; border-radius: 999px; }
  .cam .txt { padding: 14px 16px 16px; }
  .cam .txt b { display: block; font-size: 17px; font-weight: 800; }
  .cam .txt .v { margin-top: 6px; font-size: 16px; font-weight: 700; color: var(--ink-2); }
  .cam .txt .v.wet { color: var(--flood-ink); } .cam .txt .v.maybe { color: var(--amber-ink); }
  .cam .txt small { display: block; margin-top: 4px; font-size: 13px; color: var(--ink-3); font-weight: 600; }
  .sig { border-top: 1px solid var(--line); padding: 14px 0; }
  .sig b { display: block; font-size: 16px; font-weight: 800; }
  .sig span { display: block; font-size: 14px; color: var(--ink-3); font-weight: 600; margin-top: 2px; }
  .sum { font-size: 16px; font-weight: 600; color: var(--ink-2); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
  .gauge { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 14px; }
  .gauge b { display: block; font-size: 17px; font-weight: 800; }
  .gauge p { font-size: 15px; font-weight: 600; color: var(--ink-2); margin-top: 4px; }
  .gauge svg { width: 100%; height: 90px; margin-top: 10px; }
  .credit { font-size: 13px; color: var(--ink-3); font-weight: 600; margin-top: 4px; }

  /* ---------- map markers ---------- */
  .pin { z-index: 3; width: 34px; height: 34px; border-radius: 50%; background: var(--card); border: 3px solid var(--ink); color: var(--ink); display: grid; place-items: center;
    font: 900 14px/1 "Overpass", sans-serif; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .pin.depot { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pin.end { background: var(--ink); color: var(--paper); }
  .pin.hold { border-color: var(--flood); color: var(--flood); }
  .pin.hot { transform: scale(1.25); transition: transform .2s var(--ease); }
  .campin { z-index: 1; width: 24px; height: 24px; border-radius: 7px; opacity: .85; background: var(--card); border: 2px solid var(--ink-2); display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.18); }
  .campin svg { width: 13px; height: 13px; }
  .maplibregl-popup-content { border-radius: 14px; padding: 12px 14px; font: 600 15px/1.4 "Overpass", sans-serif; color: var(--ink); background: var(--card); box-shadow: var(--shadow); max-width: 280px; }
  .maplibregl-ctrl-attrib { font-family: "Overpass", sans-serif; }

  /* ---------- portrait: banner, map, list stacked ---------- */
  @media (orientation: portrait) {
    :root { --banner: 196px; }
    .banner { flex-wrap: wrap; gap: 14px 24px; }
    .say { flex-direction: column; align-items: flex-start; gap: 10px; flex-basis: 100%; }
    #rest { max-width: none; }
    .body { grid-template-columns: 1fr; grid-template-rows: 44% 1fr; }
    .list { border-left: 0; border-top: 1px solid var(--line); }
    .banner .when { position: absolute; right: calc(32px + var(--sr)); top: 22px; }
  }
  @media (max-width: 900px) and (orientation: landscape) { #big { font-size: 44px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <span class="brand">Noah</span>
  <nav class="seg" aria-label="Places">
    <button type="button" data-place="home" aria-pressed="false">Home</button>
    <button type="button" data-place="work" aria-pressed="false">Work</button>
    <button type="button" data-place="delivery" aria-pressed="true">Delivery</button>
  </nav>
  <button class="livebtn" id="liveBtn" type="button" aria-controls="sheet"><span class="dot"></span><span id="liveLbl">Live</span></button>
</header>

<section class="banner" aria-live="polite">
  <div class="say" id="say"><div id="big" class="num">Checking roads…</div><div id="rest"></div></div>
  <button class="when num" id="when" type="button" aria-haspopup="dialog" aria-expanded="false" hidden>
    <span id="whenLbl">Leaving</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
  </button>
</section>

<main class="body">
  <div id="map"><div class="issued num" id="issued"></div></div>
  <aside class="list">
    <div class="lh"><span class="k" id="listHead">Your stops</span><button class="best num" id="best" type="button" hidden></button></div>
    <div class="rows" id="rows"></div>
  </aside>
</main>

<div class="scrim" id="scrim" hidden></div>
<div class="pop" id="pop" role="dialog" aria-label="When are you leaving?" hidden>
  <h3>When are you leaving?</h3>
  <div class="val num" id="popVal"></div>
  <input type="range" id="dep" aria-label="Departure time">
  <div class="ticks num" id="ticks"></div>
  <div class="foot"><span id="popNote"></span><button class="tb" id="nowBtn" type="button">Now</button></div>
</div>

<aside class="sheet" id="sheet" aria-label="Live">
  <div class="sh"><h2><span class="dot"></span>Live</h2>
    <button class="x" id="closeSheet" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="cams" aria-selected="true">Cameras</button>
    <button role="tab" data-tab="checks" aria-selected="false">Live checks</button>
    <button role="tab" data-tab="past" aria-selected="false">Last 18 h</button>
  </div>
  <div class="pane" id="pane"></div>
</aside>

<script>
// Spec 021: Noah for iPad. Answers come from the recorded run under /demo/snapshot (spec 020's lookup: path + params,
// nearest departure); camera frames come live from GET /cam/{id}. No user-facing text names the recording.
const SNAP = "/demo/snapshot/index.json", SNAP_BASE = "/demo/snapshot/";
const CORRIDOR_M = 3000, STEP = 5, MAX_MIN = 18 * 60;
const FLOOD = "#d92d20", AMBER = "#f2a100", INK = "#1c1a17";
const $ = (id) => document.getElementById(id);
const tz = { timeZone: "America/New_York" };
const fClock = new Intl.DateTimeFormat("en-US", { ...tz, hour: "numeric", minute: "2-digit" });
const fHour = new Intl.DateTimeFormat("en-US", { ...tz, hour: "numeric" });
const fDay = new Intl.DateTimeFormat("en-US", { ...tz, weekday: "short", hour: "numeric", minute: "2-digit" });
const fDayHour = new Intl.DateTimeFormat("en-US", { ...tz, weekday: "short", hour: "numeric" });
const ICON = {
  cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>',
  road: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 21 8 3M20 21 16 3M12 4v2M12 10v3M12 17v3"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
};

let snap = null, issue = null, cycle = null, nowMin = 0, places = null;
let flood = new Map();
let place = "delivery", depMin = 0, order = null;
let lastStatus = new Map(); // stop label -> status word, for the "changed" mark
let markers = [], camMarkers = [], live = { cams: [], signals: [], sources: 0, summary: null, gauges: [] };
let token = 0, liveToken = 0;

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const atMin = (m) => new Date(issue.getTime() + m * 60e3);
const atHour = (h) => new Date(issue.getTime() + h * 3600e3);
const clock = (d) => fClock.format(d);
const endText = () => fDay.format(atHour(18));

// ---------- recorded answers (spec 020 lookup) ----------
const num = (x) => (x == null ? NaN : parseFloat(x));
function same(a, b) {
  if (a === b) return true;
  if (a == null || b == null) return false;
  const as = String(a).split(/[;,]/), bs = String(b).split(/[;,]/);
  return as.length === bs.length && as.every((x, i) => { const na = num(x), nb = num(bs[i]); return isFinite(na) && isFinite(nb) ? Math.abs(na - nb) < 1e-4 : x === bs[i]; });
}
function lookup(path, p) {
  let best = null, bestD = Infinity;
  for (const e of snap.responses) {
    if (e.path !== path) continue;
    let ok = true, d = 0;
    for (const k of new Set([...Object.keys(p), ...Object.keys(e.p)])) {
      if (k === "depart_h") { d = Math.abs(num(p[k] ?? 0) - num(e.p[k] ?? 0)); continue; }
      if (!same(p[k], e.p[k])) { ok = false; break; }
    }
    if (ok && d < bestD) { best = e; bestD = d; }
  }
  return best?.file || null;
}
async function ask(path, p) {
  const f = lookup(path, p);
  if (!f) return null;
  try { return await fetch(SNAP_BASE + f).then((r) => (r.ok ? r.json() : null)); } catch { return null; }
}
const ll = (x) => `${x.lat},${x.lon}`;

// ---------- map ----------
const map = new maplibregl.Map({ container: "map", style: "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
  center: [-84.39, 33.84], zoom: 11.5, attributionControl: { compact: true }, pitchWithRotate: false, dragRotate: false });
map.touchZoomRotate.disableRotation();
const empty = { type: "FeatureCollection", features: [] };
const mapReady = new Promise((res) => (map.isStyleLoaded() ? res() : map.once("style.load", res)));
function warmStyle() { // Carto Positron recoloured to warm paper: sand land, muted water, white streets, peach arterials
  for (const l of map.getStyle().layers) {
    const id = l.id;
    try {
      if (l.type === "background") map.setPaintProperty(id, "background-color", "#efe8dc");
      else if (l.type === "fill" && /water/.test(id)) map.setPaintProperty(id, "fill-color", "#c9dadc");
      else if (l.type === "fill" && /park|landcover|wood|grass/.test(id)) map.setPaintProperty(id, "fill-color", "#e2e4cc");
      else if (l.type === "fill" && /building/.test(id)) map.setPaintProperty(id, "fill-color", "#e8e0d2");

  return camFrames.get(id);
}
setInterval(() => camFrames.clear(), 5 * 60e3); // fresh frames every 5 min
let tab = "cams", focusCam = null;
let camIO = null;
function showFrame(art) { // live frame, fetched when its card scrolls into view
  liveFrame(art.dataset.cam).then((f) => {
        const fr = art.querySelector(".frame");
        if (!f || !f.image_url) { fr.innerHTML = "<span>Camera not responding</span>"; return; }
        const img = new Image(); img.alt = `Live camera: ${f.title || ""}`; img.onerror = () => (fr.innerHTML = "<span>Camera not responding</span>");
        img.onload = () => { fr.replaceChildren(img); const t = document.createElement("span"); t.className = "tag num";
          t.innerHTML = `<span class="dot"></span>Live${f.updated_utc ? " · " + esc(clock(new Date(f.updated_utc))) : ""}`; fr.append(t); };
        img.src = f.image_url;
      });
}
function renderPane() {
  const pane = $("pane");
  if (tab === "cams") {
    if (!live.cams.length) { pane.innerHTML = '<div class="empty">No traffic cameras along this trip.</div>'; return; }
    const cams = focusCam ? [...live.cams].sort((a, b) => (b.cam_id === focusCam) - (a.cam_id === focusCam)) : live.cams;
    pane.innerHTML = cams.map((c) => { const v = verdict(c); return `<article class="cam" data-cam="${c.cam_id}">
      <div class="frame"><span>Loading camera…</span></div>
      <div class="txt"><b>${esc(c.name)}</b><div class="v ${v.cls}">${esc(v.text)}</div><small class="num">${esc(v.when)}</small></div></article>`; }).join("")
      + '<p class="credit">Webcams provided by Windy.com</p>';
    camIO?.disconnect();
    camIO = new IntersectionObserver((ents) => ents.forEach((en) => { if (en.isIntersecting) { camIO.unobserve(en.target); showFrame(en.target); } }), { root: pane, rootMargin: "300px" });
    pane.querySelectorAll(".cam").forEach((art) => camIO.observe(art));
  } else if (tab === "checks") {
    const head = live.summary ? `<div class="sum">${esc(live.summary)}</div>` : "";
    pane.innerHTML = head + (live.signals.length ? live.signals.map((s) => `<div class="sig"><b>${esc(s.title)}</b><span>${esc(s.source)}${s.detail ? " · " + esc(s.detail) : ""}</span></div>`).join("") : '<div class="empty">Nothing reported nearby right now.</div>')
      + (live.sources ? `<p class="credit">${live.sources} sources checked</p>` : "");
  } else {
    const g = live.gauges || [];
    pane.innerHTML = g.length ? g.map((x) => `<div class="gauge"><b>${esc(x.name || "USGS gauge " + x.site.replace("USGS-", ""))}</b>
      <p class="num">${x.change_ft >= 0 ? "Rose" : "Fell"} ${Math.abs(x.change_ft).toFixed(1)} ft in the last 18 h · peak ${x.max} ${esc(x.units)}${x.max_time_local ? " at " + esc(x.max_time_local) : ""}</p>${spark(x.series || [])}
      <p class="credit">USGS stream gauge, observed</p></div>`).join("") : '<div class="empty">No stream gauges along this trip.</div>';
  }
}
function spark(series) {
  const v = series.map((s) => (Array.isArray(s) ? s[1] : s.v ?? s.value)).filter((x) => x != null && isFinite(x));
  if (v.length < 2) return "";
  const lo = Math.min(...v), hi = Math.max(...v), W = 400, H = 90;
  const pts = v.map((y, i) => `${(i / (v.length - 1)) * W},${H - 6 - ((y - lo) / (hi - lo || 1)) * (H - 12)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${INK}" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}
const reveal = (el, cls) => { el.hidden = false; void el.offsetWidth; el.classList.add(cls); }; // reflow, then transition
function openSheet(t = tab, cam = null) {
  tab = t; focusCam = cam;
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === tab));
  renderPane();
  reveal($("scrim"), "dim");
  reveal($("sheet"), "open");
}
function closeAll() {
  $("sheet").classList.remove("open"); $("pop").hidden = true; $("when").setAttribute("aria-expanded", "false");
  $("scrim").classList.remove("dim"); setTimeout(() => ($("scrim").hidden = true), 250);
}
$("liveBtn").onclick = () => openSheet("cams");
$("closeSheet").onclick = closeAll;
$("scrim").onclick = closeAll;
document.querySelector(".tabs").onclick = (e) => { const b = e.target.closest("button"); if (b) openSheet(b.dataset.tab); };

// ---------- departure ----------
const dep = $("dep");
function paintRange() { dep.style.setProperty("--p", `${((dep.value - dep.min) / (dep.max - dep.min)) * 100}%`); }
function popText() {
  $("popVal").textContent = +dep.value <= nowMin ? `Now · ${clock(atMin(+dep.value))}` : fDay.format(atMin(+dep.value));
  paintRange();
}
let depTimer = null;
dep.addEventListener("input", () => {
  popText(); clearTimeout(depTimer);
  depTimer = setTimeout(() => { depMin = +dep.value; setWhen(true); render(); }, 90);
});
$("when").onclick = () => {
  const open = $("pop").hidden;
  if (!open) return closeAll();
  dep.value = depMin; popText();
  $("pop").hidden = false; $("when").setAttribute("aria-expanded", "true");
  reveal($("scrim"), "dim");
};
$("nowBtn").onclick = () => { dep.value = nowMin; dep.dispatchEvent(new Event("input")); };

// ---------- places ----------
function render() { return place === "delivery" ? renderDelivery() : place === "work" ? renderWork() : renderHome(); }
document.querySelector(".seg").onclick = (e) => {
  const b = e.target.closest("button"); if (!b || b.dataset.place === place) return;
  place = b.dataset.place;
  document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  renderDelivery.fitted = false; skeleton(); say("Checking roads…", "");
  render();
};

// ---------- start ----------
(async function start() {
  skeleton(7);
  try { snap = await fetch(SNAP, { cache: "no-store" }).then((r) => r.json()); }
  catch { say("Can't confirm roads", "Treat low roads near creeks as impassable. In an emergency call 911."); rowsEl.innerHTML = ""; return; }
  cycle = snap.cycle; places = snap.places; nowMin = snap.now_min || 0; depMin = nowMin;
  const m = cycle.match(/^(\d{4})(\d{2})(\d{2})T(\d{2})Z$/);
  issue = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4]));
  order = places.delivery.stops.map((_, i) => i);
  $("issued").textContent = `Forecast issued ${fDay.format(issue)}`;
  dep.min = nowMin; dep.max = MAX_MIN; dep.step = STEP;
  $("ticks").innerHTML = [0, 3, 6, 9, 12, 15, 18].map((h) => `<span>${fHour.format(atMin(nowMin + (h / 18) * (MAX_MIN - nowMin)))}</span>`).join("");
  $("popNote").textContent = `Forecast window ends ${endText()}`;
  try {
    const fc = await fetch(`/data/flood_${cycle}.geojson`).then((r) => r.json());
    for (const f of fc.features) flood.set(f.properties.seg_id, f);
  } catch {}
  try { plans = await fetch(SNAP_BASE + "ipad_plans.json").then((r) => r.json()); } catch {}
  render();
})();
</script>
</body>
