<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noah</title>
<meta name="description" content="Which streets are forecast to flood, and when to leave.">
<meta name="theme-color" content="#faf7f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Noah">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800;900&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  /* Spec 021, docs/09-IPAD_APP.md: warm paper, maps-app shell. Orange is for controls only; roads use red and amber. */
  :root {
    --paper: #faf7f2; --card: #fffdf9; --sand: #efe8dc; --line: #e7dfd2;
    --ink: #1c1a17; --ink-2: #4f4a42; --ink-3: #6b6356;
    --accent: #c2410c; --accent-ink: #a3360a; --accent-soft: #fbe9dc;
    --flood: #d92d20; --flood-ink: #a8231a; --flood-soft: #fbe4e1;
    --amber: #f2a100; --amber-ink: #8a5100; --amber-soft: #fbefd5;
    --me: #1f6feb;
    --shadow: 0 1px 2px rgba(28,26,23,.06), 0 14px 36px -12px rgba(28,26,23,.30);
    --ease: cubic-bezier(.2,.9,.25,1);
    --gap: 16px; --panel: 420px;
    --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--sand); color: var(--ink);
    font: 17px/1.4 "Overpass", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }
  #map { position: fixed; inset: 0; }

  /* ---------- floating panel (left in landscape, bottom sheet in portrait) ---------- */
  .panel { position: fixed; z-index: 5; left: calc(var(--gap) + var(--sl)); top: calc(var(--gap) + var(--st)); width: var(--panel);
    max-height: calc(100dvh - 2 * var(--gap) - var(--st) - var(--sb)); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: 12px; padding-bottom: 2px; scrollbar-width: none; }
  .panel::-webkit-scrollbar { display: none; }
  .panel > * { flex-shrink: 0; }
  .card { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); }
  .brandrow { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 12px 18px; }
  .brand { font-size: 27px; font-weight: 900; letter-spacing: -.03em; color: var(--ink); }
  .storm { margin-left: 12px; margin-right: auto; padding: 6px 12px; border-radius: 999px; background: var(--flood-soft); color: var(--flood-ink); font-size: 14px; font-weight: 800; line-height: 1.2; }
  .livebtn { display: inline-flex; align-items: center; gap: 9px; min-height: 44px; padding: 0 16px; border-radius: 999px; background: var(--paper);
    border: 1.5px solid var(--line); font-weight: 800; font-size: 15px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--flood); flex: none; }

  /* planner */
  .planner { padding: 14px 14px 12px; }
  .fields { position: relative; padding-right: 54px; }
  .field { position: relative; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 12px; border-radius: 14px; background: var(--paper); border: 1.5px solid var(--line); }
  .field + .field, #stopsBox .field, #stopsBox + .field { margin-top: 8px; }
  .field:focus-within { border-color: var(--ink-3); }
  .field input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-weight: 700; font-size: 17px; padding: 14px 0 12px; }
  .field input::placeholder { color: var(--ink-3); font-weight: 600; }
  .folded { width: 100%; text-align: left; }
  .folded .ft { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .folded .ed { flex: none; color: var(--accent-ink); font-weight: 800; font-size: 15px; }
  .mk { flex: none; width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--ink); background: var(--card); }
  .mk.me { border-color: var(--me); background: var(--me); box-shadow: 0 0 0 4px rgba(31,111,235,.18); }
  .mk.end { width: 16px; height: 20px; border: 0; border-radius: 0; background: none; }
  .mk.end svg, .disc.end svg { display: block; width: 100%; height: 100%; }
  .destsvg .pb { fill: var(--ink); stroke: var(--card); stroke-width: 2; } .destsvg.hold .pb { fill: var(--flood); }
  .destsvg circle { fill: var(--card); } .destsvg .x { stroke: var(--card); stroke-width: 2.6; stroke-linecap: round; fill: none; }
  .mk.n { width: 24px; height: 24px; border: 0; background: var(--ink); color: var(--paper); font-weight: 900; font-size: 12px; display: grid; place-items: center; }
  .fx { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-3); }
  .fx svg, .ib svg, .tb svg { width: 18px; height: 18px; }
  .swap { position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; background: var(--sand); display: grid; place-items: center; }
  .swap svg { width: 20px; height: 20px; }
  .sug { position: absolute; z-index: 3; left: 0; right: 0; top: calc(100% + 6px); background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; }
  .sug button { width: 100%; text-align: left; display: block; padding: 11px 12px; border-radius: 10px; font-weight: 700; font-size: 16px; }
  .sug button small { display: block; font-weight: 600; color: var(--ink-3); font-size: 13px; }
  .sug button:active, .sug button:focus { background: var(--sand); outline: 0; }
  .actions { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .tb { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 14px; border-radius: 12px; background: var(--sand); font-weight: 800; font-size: 15px; }
  .when { background: var(--accent-soft); color: var(--accent-ink); }
  .go { margin-left: auto; background: var(--accent); color: #fff; padding: 0 18px; }
  .go[disabled] { opacity: .45; }

  /* saved routes */
  .saved { padding: 16px 14px 8px; }
  .k { font-size: 12.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: 0 6px 8px; }
  .sv { width: 100%; text-align: left; display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 10px 8px; border-radius: 14px; }
  .sv + .sv { border-top: 1px solid var(--line); border-radius: 0 0 14px 14px; }
  .sv:active { background: var(--sand); }
  .sv .ic { flex: none; width: 44px; height: 44px; border-radius: 12px; background: var(--sand); display: grid; place-items: center; color: var(--ink); }
  .sv .ic svg { width: 22px; height: 22px; }
  .sv b { display: block; font-size: 17px; font-weight: 800; line-height: 1.2; }
  .sv small { display: block; font-size: 14px; color: var(--ink-3); font-weight: 600; margin-top: 2px; }
  .sv .chev { margin-left: auto; color: var(--ink-3); }
  .sv .chev svg { width: 18px; height: 18px; }

  /* result */
  .result { display: flex; flex-direction: column; }
  .answer { background: var(--ink); color: var(--paper); padding: 18px 20px 18px; border-radius: 20px 20px 0 0; }
  .answer .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .answer .lbl { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
  .answer .x { width: 40px; height: 40px; border-radius: 50%; background: rgba(250,247,242,.14); display: grid; place-items: center; color: var(--paper); }
  .answer .x svg { width: 18px; height: 18px; }
  #big { font-size: 40px; font-weight: 900; letter-spacing: -.025em; line-height: 1.02; }
  #rest { font-size: 17px; font-weight: 600; opacity: .9; margin-top: 6px; line-height: 1.3; }
  .say.in { animation: sayin .3s var(--ease); }
  @keyframes sayin { from { opacity: .3; transform: translateY(4px); } }
  .lh { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px 6px; }
  .best { min-height: 40px; padding: 0 12px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-ink); font-weight: 800; font-size: 14px; }
  .rows { padding: 0 18px 14px; }
  .row { width: 100%; text-align: left; display: block; border-top: 1px solid var(--line); position: relative; }
  .row .main { display: flex; align-items: center; gap: 12px; min-height: 68px; }
  .row.changed::before { content: ""; position: absolute; left: -10px; top: 10px; bottom: 10px; width: 4px; border-radius: 2px; background: var(--accent); }
  .disc { flex: none; display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: var(--paper); font-weight: 900; font-size: 14px; }
  .disc.hold { background: var(--flood); } .disc.lite { background: var(--sand); color: var(--ink); }
  .disc.end { width: 22px; height: 28px; margin: 0 5px; border-radius: 0; background: none; }
  .disc.fl { background: var(--flood); } .disc.unc { background: var(--amber); color: var(--ink); }
  .row .name { flex: 1; min-width: 0; font-size: 17px; font-weight: 800; line-height: 1.2; }
  .row .name small { display: block; font-size: 13.5px; font-weight: 600; color: var(--ink-3); margin-top: 2px; }
  .st { flex: none; font-weight: 800; font-size: 15px; line-height: 1.15; text-align: center; max-width: 48%; padding: 7px 11px; border-radius: 10px; }
  .st.go { background: #ffe9b8; color: #3d2600; }
  .st small { display: block; font-size: 11.5px; font-weight: 800; letter-spacing: .02em; opacity: .75; }
  .st b { display: block; font-size: 16.5px; font-weight: 900; }
  .st.hold { background: var(--flood); color: #fff; }
  .st.no { background: var(--sand); color: var(--ink-2); }
  .more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s var(--ease); }
  .row.open .more { grid-template-rows: 1fr; }
  .more > div { overflow: hidden; }
  .more p { font-size: 15px; font-weight: 600; color: var(--ink-2); padding: 0 0 6px 44px; }
  .more p:last-child { padding-bottom: 14px; color: var(--ink-3); font-size: 13.5px; }
  .empty { padding: 20px 0; color: var(--ink-3); font-weight: 600; }
  .skel { height: 68px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  .skel i { display: block; height: 13px; border-radius: 7px; background: var(--sand); }

  /* map chrome */
  .chip { position: fixed; z-index: 4; background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 9px 13px; font-size: 14px; font-weight: 700; color: var(--ink-2); }
  .legend { right: calc(var(--gap) + var(--sr)); top: calc(var(--gap) + var(--st)); display: flex; gap: 14px; align-items: center; }
  .legend i { display: inline-block; width: 22px; height: 5px; border-radius: 3px; vertical-align: middle; margin-right: 6px; }
  .legend .l-fl { background: var(--flood); }
  .legend .l-us { background: repeating-linear-gradient(90deg, #6b6356 0 4px, transparent 4px 8px); }
  .legend .l-lt { background: var(--flood); opacity: .3; }
  .legend .l-un { background: repeating-linear-gradient(90deg, var(--amber) 0 6px, transparent 6px 10px); }
  .fab { position: fixed; z-index: 4; right: calc(var(--gap) + var(--sr)); bottom: calc(var(--gap) + var(--sb) + 80px); width: 52px; height: 52px; border-radius: 50%;
    background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--me); }
  .fab svg { width: 24px; height: 24px; }
  .me { width: 20px; height: 20px; border-radius: 50%; background: var(--me); border: 3px solid #fff; box-shadow: 0 0 0 8px rgba(31,111,235,.18), 0 1px 4px rgba(0,0,0,.3); }
  .pin { z-index: 3; width: 32px; height: 32px; border-radius: 50%; background: var(--card); border: 3px solid var(--ink); color: var(--ink); display: grid; place-items: center;
    font: 900 13px/1 "Overpass", sans-serif; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .pin.start { width: 22px; height: 22px; border-width: 5px; }
  .dest { z-index: 4; display: flex; align-items: flex-end; gap: 4px; pointer-events: none; }
  .dest svg { width: 28px; height: 36px; flex: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.28)); }
  .dest .lbl { margin-bottom: 22px; padding: 3px 10px; border-radius: 999px; background: var(--card); color: var(--ink); white-space: nowrap;
    font: 800 13px/1.2 "Overpass", sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  .pin.hold { border-color: var(--flood); color: var(--flood); }
  .pin.hot { transform: scale(1.25); }
  .campin { z-index: 1; width: 22px; height: 22px; padding: 0; border-radius: 50%; background: var(--ink); border: 2px solid #fffdf9; display: grid; place-items: center;
    box-shadow: 0 1px 4px rgba(0,0,0,.25); -webkit-appearance: none; appearance: none; line-height: 0; }
  .campin svg { width: 12px; height: 12px; display: block; }
  .maplibregl-popup-content { border-radius: 14px; padding: 12px 14px; font: 600 15px/1.4 "Overpass", sans-serif; color: var(--ink); background: var(--card); box-shadow: var(--shadow); max-width: 280px; }
  .maplibregl-ctrl-attrib { font-family: "Overpass", sans-serif; }

  /* better-order suggestion */
  .suggest { position: fixed; z-index: 6; width: 380px; right: calc(var(--gap) + var(--sr) + 72px); bottom: calc(var(--gap) + var(--sb) + 70px); padding: 18px 18px 16px;
    border: 2px solid var(--accent); animation: sgin .38s var(--ease); }
  @keyframes sgin { from { opacity: 0; transform: translateY(14px) scale(.97); } }
  .sgk { font-size: 12.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); }
  .sgh { font-size: 26px; font-weight: 900; letter-spacing: -.02em; margin-top: 4px; }
  .sgb { font-size: 15.5px; font-weight: 600; color: var(--ink-2); margin-top: 4px; }
  .sgo { margin: 10px 0 0; padding: 0 0 0 22px; font-size: 15px; font-weight: 700; color: var(--ink); }
  .sgo li { margin: 2px 0; break-inside: avoid; }
  .sga { display: flex; gap: 8px; margin-top: 14px; }
  .sga .go { margin-left: auto; }
  @media (orientation: portrait) { .suggest { left: calc(var(--gap) + var(--sl)); right: calc(var(--gap) + var(--sr)); width: auto; bottom: auto; top: calc(var(--gap) + var(--st) + 60px); } }

  /* departure popover */
  .scrim { position: fixed; inset: 0; z-index: 8; background: rgba(28,26,23,0); transition: background .25s var(--ease); }
  .scrim.dim { background: rgba(28,26,23,.30); }
  .pop { position: fixed; z-index: 9; width: 440px; max-width: calc(100vw - 32px); background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: 20px 22px 18px; animation: popin .22s var(--ease); }
  @keyframes popin { from { opacity: 0; transform: scale(.97) translateY(-6px); } }
  .pop h3 { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .pop .val { font-size: 36px; font-weight: 900; letter-spacing: -.02em; margin: 4px 0 12px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--accent) 0 var(--p, 0%), var(--sand) var(--p, 0%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 34px; margin-top: -13px; border-radius: 50%; background: #fff; border: 4px solid var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  input[type=range]::-moz-range-track { height: 8px; border-radius: 4px; background: var(--sand); }
  input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 4px solid var(--accent); }
  .ticks { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700; color: var(--ink-3); }
  .pop .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13.5px; color: var(--ink-3); font-weight: 600; }

  /* live sheet */
  .sheet { position: fixed; z-index: 9; top: 0; right: 0; bottom: 0; width: min(460px, 92vw); background: var(--paper); box-shadow: var(--shadow);
    display: flex; flex-direction: column; padding-top: var(--st); transform: translateX(105%); transition: transform .32s var(--ease); }
  .sheet.open { transform: none; }
  .sh { display: flex; align-items: center; justify-content: space-between; padding: 20px calc(22px + var(--sr)) 12px 22px; }
  .sh h2 { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 900; }
  .xb { width: 46px; height: 46px; border-radius: 50%; background: var(--sand); display: grid; place-items: center; }
  .xb svg { width: 20px; height: 20px; }
  .tabs { display: flex; gap: 2px; margin: 0 calc(22px + var(--sr)) 6px 22px; background: var(--sand); border-radius: 14px; padding: 4px; }
  .tabs button { flex: 1; min-height: 44px; border-radius: 11px; font-weight: 800; font-size: 15px; color: var(--ink-2); }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .pane { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px calc(22px + var(--sr)) calc(26px + var(--sb)) 22px; }
  .cam { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; margin-bottom: 14px; }
  .frame { position: relative; aspect-ratio: 16 / 9; background: #2b2925; display: grid; place-items: center; color: #cfc6b8; font-weight: 700; font-size: 15px; }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .frame .tag { position: absolute; left: 12px; top: 12px; display: inline-flex; align-items: center; gap: 8px; background: rgba(28,26,23,.78); color: #fff; font-size: 13px; font-weight: 800; padding: 6px 10px; border-radius: 999px; }
  .cam .txt { padding: 13px 15px 15px; }
  .cam .txt b { display: block; font-size: 16.5px; font-weight: 800; }
  .cam .txt .v { margin-top: 5px; font-size: 15.5px; font-weight: 700; color: var(--ink-2); }
  .cam .txt .v.wet { color: var(--flood-ink); } .cam .txt .v.maybe { color: var(--amber-ink); }
  .cam .txt small { display: block; margin-top: 4px; font-size: 13px; color: var(--ink-3); font-weight: 600; }
  .sig { border-top: 1px solid var(--line); padding: 13px 0; }
  .sig b { display: block; font-size: 15.5px; font-weight: 800; }
  .sig span { display: block; font-size: 13.5px; color: var(--ink-3); font-weight: 600; margin-top: 2px; }
  .sum { font-size: 15.5px; font-weight: 600; color: var(--ink-2); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 13px 15px; margin-bottom: 10px; }
  .gauge { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 15px; margin-bottom: 12px; }
  .gauge b { display: block; font-size: 16.5px; font-weight: 800; }
  .gauge p { font-size: 14.5px; font-weight: 600; color: var(--ink-2); margin-top: 4px; }
  .gauge svg { width: 100%; height: 84px; margin-top: 10px; }
  .credit { font-size: 13px; color: var(--ink-3); font-weight: 600; margin-top: 4px; }

  /* portrait: the panel becomes a bottom sheet */
  @media (orientation: portrait) {
    .panel { top: auto; left: calc(var(--gap) + var(--sl)); right: calc(var(--gap) + var(--sr)); width: auto; max-height: 56vh; bottom: calc(var(--gap) + var(--sb)); }
    .fab { bottom: auto; top: calc(var(--gap) + var(--st) + 104px); }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="map" aria-label="Map"></div>

<aside class="panel" aria-label="Noah">
  <div class="card brandrow"><span class="brand">Noah</span><span class="storm" id="storm" hidden></span>
    <button class="livebtn" id="liveBtn" type="button" aria-controls="sheet"><span id="liveLbl">Sources</span></button></div>

  <section class="card planner" aria-label="Route">
    <div class="fields" id="fields">
      <div class="field"><span class="mk me" id="fromMk"></span><input id="from" placeholder="Your location" autocomplete="off" aria-label="Start"></div>
      <div id="stopsBox"></div>
      <div class="field"><span class="mk end"><svg class="destsvg" viewBox="0 0 28 36" aria-hidden="true"><path class="pb" d="M14 35s11-11.6 11-21A11 11 0 0 0 3 14c0 9.4 11 21 11 21z"/><circle cx="14" cy="14" r="4.5"/></svg></span><input id="to" placeholder="Where to?" autocomplete="off" aria-label="Destination">
        <button class="fx" id="toClear" type="button" aria-label="Clear destination" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>

const num = (x) => (x == null ? NaN : parseFloat(x));

  return as.length === bs.length && as.every((x, i) => { const na = num(x), nb = num(bs[i]); return isFinite(na) && isFinite(nb) ? Math.abs(na - nb) < 1e-4 : x === bs[i]; });
}
function lookup(path, p) {

    for (const k of new Set([...Object.keys(p), ...Object.keys(e.p)])) {

      if (!same(p[k], e.p[k])) { ok = false; break; }

// ---------- map ----------
const map = new maplibregl.Map({ container: "map", style: "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
  center: [-84.39, 33.82], zoom: 10.6, attributionControl: { compact: true }, dragRotate: false, pitchWithRotate: false });

}

  map.addLayer({ id: "all-fl", type: "line", source: "all", filter: ["==", ["get", "s"], "flooded"], layout: { "line-cap": "round" }, paint: { "line-color": FLOOD, "line-width": ["interpolate", ["linear"], ["zoom"], 10, 2.5, 14, 5.5], "line-opacity": 0.9 } });

  map.addLayer({ id: "route-casing", type: "line", source: "route", layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": "#fffdf9", "line-width": 11 } });
  map.addLayer({ id: "route", type: "line", source: "route", layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": INK, "line-width": 6 } });

  map.addLayer({ id: "haz-casing", type: "line", source: "haz", filter: ["==", ["get", "s"], "flooded"], layout: { "line-cap": "round" }, paint: { "line-color": "#fffdf9", "line-width": 10 } });
  map.addLayer({ id: "haz-fl", type: "line", source: "haz", filter: ["==", ["get", "s"], "flooded"], layout: { "line-cap": "round" }, paint: { "line-color": FLOOD, "line-width": 6 } });

});
function stateAt(p, h) {
  if (p.t_flood != null && p.t_flood !== "null" && +p.t_flood <= h) return "flooded";
  if (p.t_uncertain != null && p.t_uncertain !== "null" && +p.t_uncertain <= h) return "uncertain";
  return null;
}
function roadSentence(p) { // §5
  const name = p.name && p.name !== "null" ? p.name : "This road";
  if (p.s === "later") { const t = p.t_flood != null && p.t_flood !== "null" ? +p.t_flood : +p.t_uncertain; return `${name}: forecast to ${p.t_flood != null && p.t_flood !== "null" ? "flood" : "turn risky"} around ${fDay.format(atHour(t))}. No forecast flooding before then.`; }
  if (p.s === "flooded") return `Do not cross ${name}. Forecast shows water reaching it around ${fDay.format(atHour(+p.t_flood))}.`;
  return `${name}: risky, treat as impassable from around ${fDay.format(atHour(+p.t_uncertain))}.`;
}
function featsAt(ids, h, later = false) {
  const out = [];
  for (const id of ids) {
    const f = flood.get(id); if (!f) continue;
    const s = stateAt(f.properties, h) || (later ? "later" : null); if (!s) continue;

const depH = () => Math.min(18, Math.floor(depMin / 60));
function drawAll() { mapReady.then(() => map.getSource("all").setData(featsAt(flood.keys(), depH(), true))); }

  markers.forEach((m) => m.remove()); markers = [];

}
const DEST = (hold) => `<svg class="destsvg${hold ? " hold" : ""}" viewBox="0 0 28 36" aria-hidden="true"><path class="pb" d="M14 35s11-11.6 11-21A11 11 0 0 0 3 14c0 9.4 11 21 11 21z"/>${hold ? '<path class="x" d="M10 10l8 8M18 10l-8 8"/>' : '<circle cx="14" cy="14" r="4.5"/>'}</svg>`;
function destPin(p, hold) {  // point B: a map pin whose tip sits on the place, with its name (J31)
  const el = document.createElement("div"); el.className = "dest"; el.title = p.label || "Destination";

function fit(coords, opts = {}) {

}

function nearLine(pt, line, maxM) {

  for (let i = 0; i < line.length; i += 2) { const dx = (line[i][0] - pt[0]) * kx, dy = (line[i][1] - pt[1]) * ky; if (dx * dx + dy * dy < maxM * maxM) return true; }

}

          const sm = document.createElement("small"); sm.textContent = where; b.append(sm);

    b.onclick = () => { stopsOpen = true; renderStops(); };

setInterval(() => camFrames.clear(), 5 * 60e3); // fresh frames every 5 min
let tab = "cams", focusCam = null, camIO = null;
function showFrame(art) { // live frame, fetched when its card scrolls into view
  liveFrame(art.dataset.cam).then((f) => {
    const fr = art.querySelector(".frame");
    if (!f || !f.image_url) { fr.innerHTML = "<span>Camera not responding</span>"; return; }
    const img = new Image(); img.alt = `Live camera: ${f.title || ""}`; img.onerror = () => (fr.innerHTML = "<span>Camera not responding</span>");
    img.onload = () => { fr.replaceChildren(img); const tg = document.createElement("span"); tg.className = "tag num";
      tg.innerHTML = `<span class="dot"></span>Live now${f.updated_utc ? " · " + esc(fLiveDay.format(new Date(f.updated_utc))) : ""}`; fr.append(tg); };
    img.src = f.image_url;
  });
}
function renderPane() {
  const pane = $("pane");
  if (tab === "cams") {
    if (!live.cams.length) { pane.innerHTML = `<div class="empty">${active ? "No traffic cameras along this route." : "Pick a route to see the cameras along it."}</div>`; return; }
    const cams = focusCam ? [...live.cams].sort((a, b) => (b.cam_id === focusCam) - (a.cam_id === focusCam)) : live.cams;
    pane.innerHTML = cams.map((c) => { const v = verdict(c); return `<article class="cam" data-cam="${c.cam_id}">
      <div class="frame"><span>Loading camera…</span></div>
      <div class="txt"><b>${esc(c.name)}</b><div class="v ${v.cls}">${esc(v.text)}</div><small class="num">${esc(v.when)}</small></div></article>`; }).join("")
      + '<p class="credit">Webcams provided by Windy.com</p>';
    camIO?.disconnect();
    camIO = new IntersectionObserver((ents) => ents.forEach((en) => { if (en.isIntersecting) { camIO.unobserve(en.target); showFrame(en.target); } }), { root: pane, rootMargin: "300px" });
    pane.querySelectorAll(".cam").forEach((art) => camIO.observe(art));
  } else if (tab === "checks") {
    const head = `<div class="sig"><b>Road flood forecast</b><span class="num">NOAA National Water Model, issued ${esc(fDayDate.format(issue))}</span></div>` + (live.summary ? `<div class="sum">${esc(live.summary)}</div>` : "");
    pane.innerHTML = head + (live.signals.length ? live.signals.map((x) => `<div class="sig"><b>${esc(x.title)}</b><span>${esc(x.source)}${x.detail ? " · " + esc(x.detail) : ""}</span></div>`).join("") : `<div class="empty">${active ? "Nothing reported along this route right now." : "Pick a route to see the checks along it."}</div>`)
      + (live.sources ? `<p class="credit">${live.sources} sources checked</p>` : "");
  } else {
    const g = live.gauges || [];
    pane.innerHTML = g.length ? g.map((x) => `<div class="gauge"><b>${esc(x.name || "USGS gauge " + x.site.replace("USGS-", ""))}</b>
      <p class="num">${x.change_ft >= 0 ? "Rose" : "Fell"} ${Math.abs(x.change_ft).toFixed(1)} ft in the last 18 h · peak ${x.max} ${esc(x.units)}${x.max_time_local ? " at " + esc(x.max_time_local) : ""}</p>${spark(x.series || [])}
      <p class="credit">USGS stream gauge, observed</p></div>`).join("") : `<div class="empty">${active ? "No stream gauges along this route." : "Pick a route to see the stream gauges along it."}</div>`;
  }
}
function spark(series) {
  const v = series.map((x) => (Array.isArray(x) ? x[1] : x.v ?? x.value)).filter((x) => x != null && isFinite(x));
  if (v.length < 2) return "";
  const lo = Math.min(...v), hi = Math.max(...v), W = 400, H = 84;
  const pts = v.map((y, i) => `${(i / (v.length - 1)) * W},${H - 6 - ((y - lo) / (hi - lo || 1)) * (H - 12)}`).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${INK}" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}
const reveal = (el, cls) => { el.hidden = false; void el.offsetWidth; el.classList.add(cls); };
function openSheet(t = tab, cam = null) {
  tab = t; focusCam = cam;
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === tab));
  renderPane(); reveal($("scrim"), "dim"); reveal($("sheet"), "open");
}
function closeAll() {
  $("sheet").classList.remove("open"); $("pop").hidden = true; $("when").setAttribute("aria-expanded", "false");
  $("scrim").classList.remove("dim"); setTimeout(() => ($("scrim").hidden = true), 250);
}
$("liveBtn").onclick = () => openSheet("cams");
$("closeSheet").onclick = closeAll;
$("scrim").onclick = closeAll;
document.querySelector(".tabs").onclick = (e) => { const b = e.target.closest("button"); if (b) openSheet(b.dataset.tab); };

// ---------- departure ----------
const dep = $("dep");
function popText() {
  $("popVal").textContent = +dep.value <= nowMin ? `Now · ${clock(atMin(+dep.value))}` : fDay.format(atMin(+dep.value));
  dep.style.setProperty("--p", `${((dep.value - dep.min) / (dep.max - dep.min)) * 100}%`);
}
let depTimer = null;
dep.addEventListener("input", () => {
  popText(); clearTimeout(depTimer);
  depTimer = setTimeout(() => { depMin = +dep.value; setWhen(); drawAll(); if (active) run(); }, 90);
});
$("when").onclick = () => {
  if (!$("pop").hidden) return closeAll();
  dep.value = depMin; popText();
  const r = $("when").getBoundingClientRect(), pop = $("pop");
  pop.style.left = `${Math.max(16, Math.min(innerWidth - 456, r.left))}px`; pop.style.top = `${r.bottom + 10}px`;
  if (r.bottom + 230 > innerHeight) pop.style.top = `${Math.max(16, r.top - 230)}px`;
  pop.hidden = false; $("when").setAttribute("aria-expanded", "true"); reveal($("scrim"), "dim");
};
$("nowBtn").onclick = () => { dep.value = nowMin; dep.dispatchEvent(new Event("input")); };

// ---------- start ----------
(async function boot() {
  try { snap = await fetch(SNAP, { cache: "no-store" }).then((r) => r.json()); }
  catch { $("savedList").innerHTML = '<div class="empty">Can\'t load roads right now. Treat low roads near creeks as impassable.</div>'; return; }
  cycle = snap.cycle; places = snap.places; nowMin = snap.now_min || 0; depMin = nowMin;
  if (cycle.startsWith("2024")) { $("storm").textContent = "Recorded storm · Hurricane Helene · Sep 26, 2024"; $("storm").hidden = false; }
  const m = cycle.match(/^(\d{4})(\d{2})(\d{2})T(\d{2})Z$/);
  issue = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4]));
  dep.min = nowMin; dep.max = MAX_MIN; dep.step = STEP;
  $("ticks").innerHTML = [0, 3, 6, 9, 12, 15, 18].map((x) => `<span>${fHour.format(atMin(nowMin + (x / 18) * (MAX_MIN - nowMin)))}</span>`).join("");
  $("popNote").textContent = `Forecast window ends ${endText()}`;
  setWhen(); renderSaved(); renderStops(); syncGo();
  try { plans = await fetch(SNAP_BASE + "ipad_plans.json").then((r) => r.json()); } catch {}
  try { const fc = await fetch(`/data/flood_${cycle}.geojson`).then(readJ); for (const f of fc.features) flood.set(f.properties.seg_id, f); } catch {}
  await mapReady; fitAllRoads(); drawAll();
})();
</script>
